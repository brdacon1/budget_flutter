name: oflite
description: A new Flutter project.

publish_to: 'none'

version: 1.8.8+104

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.5
  simple_animations: ^5.0.0
  supercharged: ^2.1.1
  cached_network_image: ^3.2.0
  google_fonts: ^6.2.1
  path_provider: ^2.1.1
  firebase_core: ^2.17.0
  firebase_auth: ^4.10.1
  cloud_firestore: ^4.9.3
  provider: ^6.0.5
  expansion_tile_card: ^3.0.0
  mask_text_input_formatter: ^2.3.0
  fluttercontactpicker: ^4.6.0
  awesome_dialog: ^3.1.0
  permission_handler: ^11.0.0
  flutter_contacts: ^1.1.3
  badges: ^3.1.1
  extended_masked_text: ^2.3.1
  firebase_core_platform_interface: ^4.8.0
  intl: ^0.19.0
  syncfusion_flutter_pdf: ^28.2.9
  syncfusion_flutter_pdfviewer: ^28.2.9
  open_file: ^3.3.2
  flutter_svg: ^2.0.7
  fl_chart: ^0.63.0
  adaptive_theme: ^3.3.0
  firebase_storage: ^11.2.5
  image_picker: ^1.0.1
  image_gallery_saver: ^2.0.3
  image_cropper: ^5.0.0
  dotted_border: ^2.0.0+3
  shared_preferences: ^2.2.0
  google_mobile_ads: ^3.0.0
  firebase_messaging: ^14.6.9
  google_sign_in: ^6.1.5
  flutter_inapp_purchase: ^5.4.2
  share: ^2.0.4
  webview_flutter: ^4.4.2
  webview_flutter_android: ^3.12.1

dependency_overrides:
  http: ^0.13.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.1

flutter:

  uses-material-design: true
  assets:
      - assets/360.png
      - assets/work.png
      - assets/pintor.png
      - assets/constru_man.png
      - assets/images/
      - assets/icons/
      - assets/login-initial-page.png
  fonts:
    - family: Montserrat-Bold
      fonts:
        - asset: assets/Montserrat-Bold.ttf

    - family: Montserrat-Medium
      fonts:
        - asset: assets/Montserrat-Medium.ttf
          
    - family: Montserrat-SemiBold
      fonts:
        - asset: assets/Montserrat-SemiBold.ttf

