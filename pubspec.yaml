name: oflite
description: A new Flutter project.

publish_to: 'none'

version: 2.0.0+143

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  simple_animations: ^5.0.2
  supercharged: ^2.1.1
  cached_network_image: ^3.4.1
  google_fonts: ^6.3.1
  path_provider: ^2.1.5
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.0.0
  provider: ^6.1.4
  expansion_tile_card: ^3.0.0
  mask_text_input_formatter: ^2.9.0
  fluttercontactpicker: 4.7.0
  permission_handler: ^13.0.0
  flutter_contacts: ^1.1.9+2
  badges: ^3.1.2
  extended_masked_text: ^3.0.1
  # firebase_core_platform_interface: ^5.4.0
  intl: ^0.20.2
  syncfusion_flutter_pdf: ^31.1.19
  syncfusion_flutter_pdfviewer: ^31.1.19
  open_file: ^3.5.11
  flutter_svg: ^2.0.17
  fl_chart: ^0.70.2
  adaptive_theme: ^3.7.0
  firebase_storage: ^13.4.6
  image_picker: ^1.1.2
  image_gallery_saver: ^2.0.3
  image_cropper: ^9.0.0
  dotted_border: ^2.0.0+3
  shared_preferences: ^2.5.3
  google_mobile_ads: ^9.0.0
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^19.0.0
  google_sign_in: ^7.2.0
  flutter_inapp_purchase: ^10.0.1
  share_plus: ^12.0.2
  webview_flutter: ^4.11.0
  webview_flutter_android: ^4.3.2
  awesome_dialog: 3.1.0

dependency_overrides:
  http: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true
  assets:
      - assets/360.png
      - assets/work.png
      - assets/pintor.png
      - assets/constru_man.png
      - assets/images/
      - assets/icons/
      - assets/login-initial-page.png
      - env/development_environment.json
      - env/production_environment.json
  fonts:
    - family: Montserrat-Bold
      fonts:
        - asset: assets/Montserrat-Bold.ttf

    - family: Montserrat-Medium
      fonts:
        - asset: assets/Montserrat-Medium.ttf

    - family: Montserrat-SemiBold
      fonts:
        - asset: assets/Montserrat-SemiBold.ttf

