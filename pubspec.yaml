name: oflite
description: A new Flutter project.

publish_to: 'none'

version: 2.1.6+173

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  dio: ^5.8.0
  cached_network_image: ^4.0.7
  google_fonts: ^9.0.0
  path_provider: ^2.1.5
  expansion_tile_card: ^3.0.0
  mask_text_input_formatter: ^2.9.0
  permission_handler: ^13.0.2
  flutter_contacts: ^2.6.0
  badges: ^4.0.1
  extended_masked_text: ^3.0.1
  intl: ^0.20.2
  syncfusion_flutter_pdf: ^35.1.46
  syncfusion_flutter_pdfviewer: ^35.1.46
  flutter_svg: ^2.4.0
  fl_chart: ^1.3.1
  adaptive_theme: 3.8.0
  image_picker: ^1.2.4
  image_cropper: ^13.0.0
  shared_preferences: ^2.5.6
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.5
  in_app_purchase_storekit: ^0.4.17
  share_plus: ^13.3.1
  web: ^1.1.0
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  get_it: ^9.3.0
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6
  url_launcher: ^6.3.3
  google_mobile_ads: ^9.2.0
  google_sign_in: ^7.2.0
  firebase_messaging: ^17.1.0
  firebase_storage: ^14.1.0
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  flutter_local_notifications: ^23.0.2
  firebase_crashlytics: ^6.1.0
  firebase_ai: ^5.2.0
  firebase_app_check: ^0.5.2
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.8
  photo_manager: ^3.12.0
  receive_sharing_intent: ^1.9.0
  flutter_image_compress: ^2.5.1
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true
  assets:
    - assets/pintor.png
    - assets/login-initial-page.png
    - env/development_environment.json
    - env/production_environment.json
    - assets/png/google_logo.png
  fonts:
    - family: Montserrat-Bold
      fonts:
        - asset: assets/Montserrat-Bold.ttf

    - family: Montserrat-Medium
      fonts:
        - asset: assets/Montserrat-Medium.ttf

    - family: Montserrat-SemiBold
      fonts:
        - asset: assets/Montserrat-SemiBold.ttf

