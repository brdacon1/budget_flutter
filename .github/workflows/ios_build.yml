name: Build iOS IPA (assinado)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: 'Provisioning profile usado na assinatura'
        required: true
        default: 'publishment'
        type: choice
        options:
          - publishment
          - development

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      BUNDLE_ID: com.housestudio.oflite
      PROFILE_KIND: ${{ github.event.inputs.profile || 'publishment' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Usa o Xcode estável mais recente disponível no runner
      # (versões fixas como 15.0.1 deixam de existir nas imagens do GitHub).
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # -----------------------------------------------------------------------
      # Arquivos e assinatura
      # -----------------------------------------------------------------------
      - name: Decode GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "::error::Secret GOOGLE_SERVICE_INFO_PLIST_BASE64 não configurado."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: Install certificate and provisioning profile
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          MOBILE_PROVISION_PUBLISHMENT: ${{ secrets.MOBILE_PROVISION_PUBLISHMENT }}
          MOBILE_PROVISION_DEVELOPMENT: ${{ secrets.MOBILE_PROVISION_DEVELOPMENT }}
        run: |
          set -euo pipefail

          if [ "$PROFILE_KIND" = "development" ]; then
            PROFILE_B64="$MOBILE_PROVISION_DEVELOPMENT"; PROFILE_SECRET=MOBILE_PROVISION_DEVELOPMENT
          else
            PROFILE_B64="$MOBILE_PROVISION_PUBLISHMENT"; PROFILE_SECRET=MOBILE_PROVISION_PUBLISHMENT
          fi

          missing=0
          [ -z "$IOS_P12_BASE64" ]   && { echo "::error::Secret IOS_P12_BASE64 não configurado."; missing=1; }
          [ -z "$IOS_P12_PASSWORD" ] && { echo "::error::Secret IOS_P12_PASSWORD não configurado."; missing=1; }
          [ -z "$PROFILE_B64" ]      && { echo "::error::Secret $PROFILE_SECRET não configurado."; missing=1; }
          [ "$missing" -eq 0 ] || exit 1

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          P12_PATH="$RUNNER_TEMP/certificate.p12"
          PP_PATH="$RUNNER_TEMP/profile.mobileprovision"
          PP_PLIST="$RUNNER_TEMP/profile.plist"

          printf '%s' "$IOS_P12_BASE64" | base64 --decode > "$P12_PATH"
          printf '%s' "$PROFILE_B64"    | base64 --decode > "$PP_PATH"

          # Keychain temporário
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Identidade de assinatura (SHA-1 do certificado importado)
          SIGN_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk 'NR==1 {print $2}')
          if [ -z "$SIGN_IDENTITY" ]; then
            echo "::error::Nenhuma identidade de assinatura válida encontrada no .p12."
            exit 1
          fi
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          # Lê os dados direto do provisioning profile
          security cms -D -i "$PP_PATH" > "$PP_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PP_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PP_PLIST")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PP_PLIST")

          # Detecta o método de exportação pelo tipo do profile
          if [ "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$PP_PLIST" 2>/dev/null)" = "true" ]; then
            EXPORT_METHOD=development
          elif /usr/libexec/PlistBuddy -c 'Print :ProvisionsAllDevices' "$PP_PLIST" >/dev/null 2>&1; then
            EXPORT_METHOD=enterprise
          elif /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$PP_PLIST" >/dev/null 2>&1; then
            EXPORT_METHOD=ad-hoc
          else
            EXPORT_METHOD=app-store
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "Profile: $PROFILE_NAME ($PROFILE_UUID)"
          echo "Team ID: $TEAM_ID"
          echo "Método:  $EXPORT_METHOD"

          {
            echo "SIGN_IDENTITY=$SIGN_IDENTITY"
            echo "PROFILE_UUID=$PROFILE_UUID"
            echo "TEAM_ID=$TEAM_ID"
            echo "EXPORT_METHOD=$EXPORT_METHOD"
          } >> "$GITHUB_ENV"

          rm -f "$P12_PATH"

      # O projeto usa assinatura automática (exige conta Apple logada no Xcode).
      # No CI trocamos para manual usando o certificado/profile instalados.
      # Alteração só no runner, não é commitada.
      - name: Configure manual signing
        run: |
          PBXPROJ=ios/Runner.xcodeproj/project.pbxproj
          sed -i '' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            -e "s/CODE_SIGN_IDENTITY = \"Apple Development\";/CODE_SIGN_IDENTITY = \"$SIGN_IDENTITY\";/g" \
            -e "s/\"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]\" = \"iPhone Developer\";/\"CODE_SIGN_IDENTITY[sdk=iphoneos*]\" = \"$SIGN_IDENTITY\";/g" \
            -e "s/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = $TEAM_ID;/g" \
            -e "s/PROVISIONING_PROFILE_SPECIFIER = \"\";/PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_UUID\";/g" \
            "$PBXPROJ"
          grep -nE "CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER|DEVELOPMENT_TEAM" "$PBXPROJ"

      - name: Generate ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${EXPORT_METHOD}</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>${SIGN_IDENTITY}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_UUID}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          cat "$RUNNER_TEMP/ExportOptions.plist"

      # -----------------------------------------------------------------------
      # Build e artefato
      # -----------------------------------------------------------------------
      - name: Build IPA
        run: |
          flutter build ipa \
            --release \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" \
            --dart-define-from-file=env/production_environment.json

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: oflite-ios-${{ env.PROFILE_KIND }}-${{ github.run_number }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
