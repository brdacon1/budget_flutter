name: Build iOS Release (IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      export_method:
        description: 'Método de exportação do IPA'
        required: true
        default: 'app-store'
        type: choice
        options:
          - app-store
          - ad-hoc
          - development
          - enterprise

jobs:
  build-ios:
    runs-on: macos-latest

    env:
      FLUTTER_VERSION: 'stable'
      XCODE_VERSION: '15.0.1'
      BUNDLE_ID: 'com.housestudio.oflite'

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Select Xcode version
      # -----------------------------------------------------------------------
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
          xcodebuild -version

      # -----------------------------------------------------------------------
      # 3. Setup Flutter
      # -----------------------------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true

      # -----------------------------------------------------------------------
      # 4. Install Flutter dependencies
      # -----------------------------------------------------------------------
      - name: Flutter pub get
        run: flutter pub get

      # -----------------------------------------------------------------------
      # 5. Validate iOS signing secrets
      # -----------------------------------------------------------------------
      - name: Validate iOS signing secrets
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          missing=()
          [ -z "$IOS_P12_BASE64" ] && missing+=("IOS_P12_BASE64")
          [ -z "$IOS_P12_PASSWORD" ] && missing+=("IOS_P12_PASSWORD")
          [ -z "$IOS_MOBILEPROVISION_BASE64" ] && missing+=("IOS_MOBILEPROVISION_BASE64")
          [ -z "$IOS_KEYCHAIN_PASSWORD" ] && missing+=("IOS_KEYCHAIN_PASSWORD")
          [ -z "$IOS_PROVISIONING_PROFILE_NAME" ] && missing+=("IOS_PROVISIONING_PROFILE_NAME")
          [ -z "$IOS_TEAM_ID" ] && missing+=("IOS_TEAM_ID")
          [ -z "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ] && missing+=("GOOGLE_SERVICE_INFO_PLIST_BASE64")

          if [ ${#missing[@]} -ne 0 ]; then
            echo "ERRO: Os seguintes secrets estão faltando no GitHub Actions:"
            for s in "${missing[@]}"; do echo "  - $s"; done
            echo ""
            echo "Consulte .github/workflows/README_IOS.md para instruções."
            exit 1
          fi

          echo "Todos os secrets de signing estão configurados."

      # -----------------------------------------------------------------------
      # 6. Decode GoogleService-Info.plist
      # -----------------------------------------------------------------------
      - name: Decode GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
          echo "GoogleService-Info.plist decodificado com sucesso."

      # -----------------------------------------------------------------------
      # 7. Setup iOS Keychain + Certificate + Provisioning Profile
      # -----------------------------------------------------------------------
      - name: Setup iOS signing
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -e

          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          P12_PATH=$RUNNER_TEMP/certificate.p12
          PP_PATH=$RUNNER_TEMP/build.mobileprovision
          KEYCHAIN_PASSWORD="$IOS_KEYCHAIN_PASSWORD"

          # Decode certificate and provisioning profile
          echo "$IOS_P12_BASE64" | base64 --decode > "$P12_PATH"
          echo "$IOS_MOBILEPROVISION_BASE64" | base64 --decode > "$PP_PATH"

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add keychain to search list
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Import certificate
          security import "$P12_PATH" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision

          echo "iOS signing configurado com sucesso."

      # -----------------------------------------------------------------------
      # 8. Force manual signing in Release configuration for CI
      # -----------------------------------------------------------------------
      - name: Configure manual signing for CI
        run: |
          # O Xcode no runner não possui a conta Apple vinculada, então
          # forçamos CODE_SIGN_STYLE = Manual para evitar falhas de signing.
          # Alteração em memória; não é commitada.
          sed -i.bak 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
          rm ios/Runner.xcodeproj/project.pbxproj.bak

          echo "Configuração de signing atualizada para CI:"
          grep -n "CODE_SIGN_STYLE" ios/Runner.xcodeproj/project.pbxproj

      # -----------------------------------------------------------------------
      # 9. Generate ExportOptions.plist
      # -----------------------------------------------------------------------
      - name: Generate ExportOptions.plist
        env:
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          EXPORT_METHOD: ${{ github.event.inputs.export_method || 'app-store' }}
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${EXPORT_METHOD}</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${IOS_PROVISIONING_PROFILE_NAME}</string>
            </dict>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          echo "ExportOptions.plist gerado:"
          cat ios/ExportOptions.plist

      # -----------------------------------------------------------------------
      # 10. Build IPA
      # -----------------------------------------------------------------------
      - name: Build IPA (Release)
        run: |
          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist \
            --dart-define-from-file=env/production_environment.json

      # -----------------------------------------------------------------------
      # 11. Upload IPA artifact
      # -----------------------------------------------------------------------
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: build/ios/ipa/*.ipa

      # -----------------------------------------------------------------------
      # 12. Cleanup keychain
      # -----------------------------------------------------------------------
      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
