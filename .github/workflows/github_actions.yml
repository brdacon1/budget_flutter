name: Build Android Release

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      # 1. Cria a pasta Key e reconstrói o arquivo .keystore a partir da Secret Base64
      - name: Decode Keystore
        run: |
          mkdir -p android/app/Key
          echo "${{ secrets.KEYSTORE_BASE_64 }}" | base64 --decode > android/app/Key/davidelias1511@gmail.com.keystore

      # 2. Executa o build passando as variáveis de ambiente necessárias
      - name: Build App Bundle (AAB)
        env:
          KEYSTORE_PATH: "Key/davidelias1511@gmail.com.keystore"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release
        working-directory: . # Ajuste se o seu projeto Flutter estiver em uma subpasta

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: build/app/outputs/bundle/release/app-release.aab